<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌈 Nuri Town (누리타운) - 입장하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', sans-serif;
      background: linear-gradient(180deg, #7dd3fc 0%, #e0f2fe 50%, #bbf7d0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1e293b;
    }
    .jua { font-family: 'Jua', sans-serif; letter-spacing: 0.4px; }

    .hero-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .hero-badge {
      display: inline-block;
      background: #fef08a;
      color: #854d0e;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 999px;
      border: 2px solid #facc15;
      margin-bottom: 8px;
    }

    .gate-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 24px;
      max-width: 1020px;
      width: 100%;
    }
    @media (max-width: 820px) {
      .gate-grid { grid-template-columns: 1fr; }
    }

    .gate-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 32px;
      border: 5px solid #ffffff;
      box-shadow: 0 18px 35px rgba(15, 23, 42, 0.12);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    @media (max-width: 520px) {
      .student-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .student-tile {
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: 22px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .student-tile:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: #fb923c;
      background: #fff7ed;
      box-shadow: 0 10px 20px rgba(249, 115, 22, 0.18);
    }
    .st-avatar { font-size: 46px; line-height: 1.1; }
    .st-name { font-family: 'Jua', sans-serif; font-size: 20px; margin-top: 6px; color: #0f172a; }
    .st-age { font-size: 12px; font-weight: 700; color: #64748b; margin-top: 2px; }
    .st-stamp {
      display: inline-block;
      margin-top: 6px;
      background: #fef9c3;
      color: #854d0e;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .name-login-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .input-box {
      flex: 1;
      padding: 12px 14px;
      border-radius: 16px;
      border: 2px solid #cbd5e1;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
    }
    .btn-3d {
      border: none;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      cursor: pointer;
      padding: 12px 20px;
      font-size: 17px;
      transition: transform 0.1s;
    }
    .btn-3d:active { transform: translateY(3px); }
    .btn-orange {
      background: linear-gradient(180deg, #fb923c, #f97316);
      color: white;
      box-shadow: 0 5px 0 #c2410c;
    }
    .btn-blue {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: white;
      box-shadow: 0 5px 0 #0369a1;
      width: 100%;
      padding: 15px;
      font-size: 19px;
    }
  </style>
</head>
<body>

  <div class="hero-header">
    <span class="hero-badge">2019 개정 누리과정 기반 AI 유아 놀이 월드</span>
    <h1 class="jua" style="font-size:40px; color:#0f172a; text-shadow: 0 3px 0 rgba(255,255,255,0.8);">
      🌈 Nuri Town <span style="color:#f97316;">누리타운</span>
    </h1>
    <p style="font-size:15px; color:#334155; font-weight:600; margin-top:4px;">
      우리 반 친구들은 내 얼굴을 눌러 놀이터로 들어가고, 선생님은 교사 모드로 입장하세요!
    </p>
  </div>

  <div class="gate-grid">
    <!-- 좌측: 꼬마 탐험가(유아) 입장 카드 -->
    <div class="gate-card" style="border-color:#fde047;">
      <div>
        <span style="background:#ffedd5; color:#c2410c; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px;">아이패드 · 유아 전용 입장</span>
        <h2 class="jua" style="font-size:26px; margin-top:6px;">🧒 꼬마 탐험가 입장하기</h2>
        <p style="font-size:13.5px; color:#64748b;">내 동물 친구 얼굴을 터치하면 바로 놀이 월드가 열려요!</p>
      </div>

      <div class="student-grid" id="student-grid">
        <div style="grid-column:1/-1; text-align:center; padding:24px; color:#64748b;">우리 반 친구들 불러오는 중...</div>
      </div>

      <div class="name-login-row">
        <input type="text" id="kid-name-input" class="input-box" placeholder="또는 내 이름을 직접 입력해요 (예: 김하준)" />
        <button class="btn-3d btn-orange" onclick="loginByName()">놀이 출발! 🚀</button>
      </div>
    </div>

    <!-- 우측: 선생님(교사) 입장 카드 -->
    <div class="gate-card" style="border-color:#bae6fd; justify-content:space-between;">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <span style="background:#e0f2fe; color:#0369a1; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; width:fit-content;">유치원 교사 전용 모드</span>
        <h2 class="jua" style="font-size:26px;">👩‍🏫 선생님 입장하기</h2>
        <p style="font-size:13.5px; color:#64748b; line-height:1.55;">
          • 오늘의 놀이 주제 & 현장 체험 코스 AI 설계<br/>
          • 우리 반 원아 등록 및 인적사항·아바타 관리<br/>
          • LangGraph 예산·휴무일 검증 리포트 확인
        </p>

        <div style="margin-top:8px;">
          <label style="display:block; font-size:13px; font-weight:800; color:#475569; margin-bottom:5px;">담임 교사 이름</label>
          <input type="text" id="teacher-name" class="input-box" style="width:100%;" value="최주희 선생님" />
        </div>
        <div>
          <label style="display:block; font-size:13px; font-weight:800; color:#475569; margin-bottom:5px;">교사 확인 코드 (기본: 1234)</label>
          <input type="password" id="teacher-pin" class="input-box" style="width:100%;" value="1234" />
        </div>
      </div>

      <button class="btn-3d btn-blue" onclick="loginTeacher()">
        📋 교사 대시보드로 들어가기
      </button>
    </div>
  </div>

  <script>
    let allStudents = [];

    async function loadStudents() {
      const res = await fetch('/api/students');
      allStudents = await res.json();
      const grid = document.getElementById('student-grid');

      if (!allStudents.length) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px; color:#64748b;">등록된 친구가 없어요. 선생님 모드에서 원아를 등록해 주세요!</div>';
        return;
      }

      grid.innerHTML = allStudents.map(s => `
        <div class="student-tile" onclick='enterKidWorld(${JSON.stringify(s)})'>
          <div class="st-avatar">${s.avatar}</div>
          <div class="st-name">${s.name}</div>
          <div class="st-age">${s.age}</div>
          <div class="st-stamp">🏅 스탬프 ${s.stamps}개</div>
        </div>
      `).join('');
    }

    function enterKidWorld(student) {
      localStorage.setItem('nuri_current_student', JSON.stringify(student));
      location.href = '/play';
    }

    function loginByName() {
      const val = document.getElementById('kid-name-input').value.trim();
      if (!val) {
        alert('내 이름을 입력하거나 위에서 얼굴을 눌러주세요!');
        return;
      }
      const found = allStudents.find(s => s.name === val);
      if (found) {
        enterKidWorld(found);
      } else {
        enterKidWorld({ id: null, name: val, age: '만 4세', avatar: '🐥', stamps: 0 });
      }
    }

    function loginTeacher() {
      const tName = document.getElementById('teacher-name').value.trim() || '담임 선생님';
      const pin = document.getElementById('teacher-pin').value.trim();
      if (pin !== '1234') {
        alert('교사 확인 코드가 올바르지 않습니다. (기본: 1234)');
        return;
      }
      localStorage.setItem('nuri_teacher_name', tName);
      location.href = '/index';
    }

    window.addEventListener('DOMContentLoaded', loadStudents);
  </script>
</body>
</html>
