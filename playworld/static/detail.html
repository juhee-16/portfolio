<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👩‍🏫 우리 반 원아 관리 - Nuri Town</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', sans-serif;
      background: linear-gradient(180deg, #e0f2fe 0%, #f0fdf4 100%);
      min-height: 100vh;
      color: #1e293b;
    }
    .jua { font-family: 'Jua', sans-serif; }

    header {
      background: white;
      border-bottom: 3px solid #bae6fd;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-links { display: flex; gap: 8px; }
    .nav-btn {
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      background: #f1f5f9;
      color: #334155;
    }
    .nav-btn.active { background: #0284c7; color: white; }

    .container {
      max-width: 1120px;
      margin: 24px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 22px;
    }
    @media (max-width: 860px) { .container { grid-template-columns: 1fr; } }

    .card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.07);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label { display: block; font-size: 13px; font-weight: 800; color: #475569; margin-bottom: 5px; }
    .input-el {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      font-family: inherit;
    }

    .avatar-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .av-opt {
      font-size: 28px;
      padding: 8px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
      text-align: center;
    }
    .av-opt.selected { border-color: #f97316; background: #fff7ed; transform: scale(1.06); }

    .btn-primary {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .student-row {
      border: 2px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .btn-sm {
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:26px;">🌈</span>
      <h1 class="jua" style="font-size:22px;">Nuri Town 교사 관리실</h1>
    </div>
    <div class="nav-links">
      <a href="/index" class="nav-btn">📋 놀이 설계 & AI 리포트</a>
      <a href="/detail" class="nav-btn active">👶 우리 반 원아 관리</a>
      <a href="/play" class="nav-btn" style="background:#fef08a; color:#854d0e;">🧒 아이 놀이 화면 보기</a>
      <a href="/" class="nav-btn">🚪 로그인 화면</a>
    </div>
  </header>

  <main class="container">
    <!-- 좌측: 반 이름 설정 + 원아 등록/수정 -->
    <section class="card">
      <div style="background:#f0f9ff; border:1.5px solid #bae6fd; border-radius:16px; padding:12px;">
        <label>🏫 우리 반 이름 설정</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="class-name-input" class="input-el" value="라온다솜반" placeholder="예: 라온다솜반" />
          <button class="btn-primary" style="padding:8px 14px; white-space:nowrap;" onclick="updateClassName()">적용</button>
        </div>
      </div>

      <h2 class="jua" id="form-heading" style="font-size:21px; color:#0369a1; margin-top:4px;">➕ 새 원아 등록하기</h2>
      <input type="hidden" id="edit-id" value="" />

      <div>
        <label>👶 원아 이름</label>
        <input type="text" id="st-name" class="input-el" placeholder="예: 김하준" />
      </div>

      <div>
        <label>🐾 아이 전용 캐릭터 얼굴 선택</label>
        <div class="avatar-picker" id="avatar-picker">
          <div class="av-opt selected" onclick="pickAvatar('🐶', this)">🐶</div>
          <div class="av-opt" onclick="pickAvatar('🐰', this)">🐰</div>
          <div class="av-opt" onclick="pickAvatar('🐻', this)">🐻</div>
          <div class="av-opt" onclick="pickAvatar('🐱', this)">🐱</div>
          <div class="av-opt" onclick="pickAvatar('🦊', this)">🦊</div>
          <div class="av-opt" onclick="pickAvatar('🐼', this)">🐼</div>
          <div class="av-opt" onclick="pickAvatar('🦁', this)">🦁</div>
          <div class="av-opt" onclick="pickAvatar('🐥', this)">🐥</div>
        </div>
      </div>

      <div>
        <label>📝 관심사 및 지도 참고 메모</label>
        <input type="text" id="st-memo" class="input-el" placeholder="예: 공룡과 만들기 활동을 좋아함" />
      </div>

      <button class="btn-primary" onclick="saveStudent()">💾 원아 정보 저장하기</button>
      <button id="cancel-edit-btn" style="display:none; background:#e2e8f0; border:none; padding:9px; border-radius:12px; font-weight:700; cursor:pointer;" onclick="resetForm()">수정 취소</button>
    </section>

    <!-- 우측: 등록된 우리 반 원아 목록 -->
    <section class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 class="jua" style="font-size:21px;">🏫 <span id="class-heading-name">라온다솜반</span> 원아 명단 (<span id="st-count">0</span>명)</h2>
        <span style="font-size:12px; color:#64748b;">로그인 화면에서 아이 얼굴을 누르면 바로 입장합니다.</span>
      </div>
      <div id="student-list" style="display:flex; flex-direction:column; gap:10px;"></div>
    </section>
  </main>

  <script>
    let selectedAvatar = '🐶';

    function updateClassName() {
      const val = document.getElementById('class-name-input').value.trim() || '라온다솜반';
      localStorage.setItem('nuri_class_name', val);
      document.getElementById('class-heading-name').textContent = val;
      alert(`우리 반 이름이 '${val}'으로 설정되었습니다!`);
    }

    function pickAvatar(emoji, el) {
      selectedAvatar = emoji;
      document.querySelectorAll('.av-opt').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    }

    async function loadStudentList() {
      const res = await fetch('/api/students');
      const list = await res.json();
      document.getElementById('st-count').textContent = list.length;

      const box = document.getElementById('student-list');
      box.innerHTML = list.map(s => `
        <div class="student-row">
          <div style="display:flex; align-items:center; gap:14px;">
            <span style="font-size:38px;">${s.avatar}</span>
            <div>
              <div style="font-weight:800; font-size:16px;">
                ${s.name}
                <span style="font-size:12px; background:#fef9c3; color:#854d0e; padding:2px 8px; border-radius:999px;">🏅 스탬프 ${s.stamps}개</span>
              </div>
              <div style="font-size:13px; color:#64748b; margin-top:3px;">${s.memo || '등록된 특이사항 없음'}</div>
            </div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-sm" style="background:#e0f2fe; color:#0369a1;" onclick='startEdit(${JSON.stringify(s)})'>수정</button>
            <button class="btn-sm" style="background:#fee2e2; color:#dc2626;" onclick="removeStudent(${s.id})">삭제</button>
          </div>
        </div>
      `).join('');
    }

    function startEdit(s) {
      document.getElementById('edit-id').value = s.id;
      document.getElementById('form-heading').textContent = `✏️ '${s.name}' 정보 수정하기`;
      document.getElementById('st-name').value = s.name;
      document.getElementById('st-memo').value = s.memo || '';
      document.getElementById('cancel-edit-btn').style.display = 'block';

      selectedAvatar = s.avatar;
      document.querySelectorAll('.av-opt').forEach(el => {
        el.classList.toggle('selected', el.textContent === s.avatar);
      });
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('form-heading').textContent = '➕ 새 원아 등록하기';
      document.getElementById('st-name').value = '';
      document.getElementById('st-memo').value = '';
      document.getElementById('cancel-edit-btn').style.display = 'none';
    }

    async function saveStudent() {
      const id = document.getElementById('edit-id').value;
      const payload = {
        name: document.getElementById('st-name').value.trim() || '새 친구',
        age: '만 4세',
        avatar: selectedAvatar,
        memo: document.getElementById('st-memo').value.trim()
      };

      if (id) {
        await fetch(`/api/students/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } else {
        await fetch('/api/students', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }
      resetForm();
      loadStudentList();
    }

    async function removeStudent(id) {
      if (!confirm('이 원아 정보를 삭제할까요?')) return;
      await fetch(`/api/students/${id}`, { method: 'DELETE' });
      loadStudentList();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const cName = localStorage.getItem('nuri_class_name') || '라온다솜반';
      document.getElementById('class-name-input').value = cName;
      document.getElementById('class-heading-name').textContent = cName;
      loadStudentList();
    });
  </script>
</body>
</html>
